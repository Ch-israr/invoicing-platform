services:
  db:
    image: postgres:16
    container_name: invoicing-db
    environment:
      POSTGRES_USER: invoicing
      POSTGRES_PASSWORD: invoicing_dev_local
      POSTGRES_DB: invoicing
    ports:
      - "5432:5432"
    volumes:
      - invoicing-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicing -d invoicing"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  invoicing-pgdata:
