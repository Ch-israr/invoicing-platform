# Render blueprint: web service (Docker) + managed Postgres.
# Review before the first deploy — especially NEXTAUTH_URL (set it to
# the service's real public URL) and the disk mount for uploads.
# Deploying is a manual, approved step; this file only declares it.
# See docs/RUNBOOK.md for the full checklist (migrations, admin seed,
# backups, secret rotation).

services:
  - type: web
    name: invoicing-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: invoicing-db
          property: connectionString
      - key: NEXTAUTH_URL
        # The plain name was taken, so Render assigned this URL
        # (first deploy 2026-11-24). Keep in sync with the dashboard.
        value: https://invoicing-platform-ap6p.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: log
      # Uploads live on the persistent disk (see below). Without the
      # disk, logos/signatures/receipts are lost on every redeploy.
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CHROMIUM_EXECUTABLE_PATH
        value: /usr/bin/chromium
    disk:
      name: invoicing-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: invoicing-db
    # Free plan ($0) — chosen 2026-11-24 to cut cost. NOTE: Render
    # free Postgres expires after 30 days and the database is deleted,
    # so this must be upgraded to a paid plan before then or all data
    # is lost. The legacy `starter` plan is retired.
    plan: free
    postgresMajorVersion: 16
