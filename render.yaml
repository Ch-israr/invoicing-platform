# Render blueprint: web service (Docker) + managed Postgres.
# Review before the first deploy — especially NEXTAUTH_URL (set it to
# the service's real public URL) and the disk mount for uploads.
# Deploying is a manual, approved step; this file only declares it.
# See docs/RUNBOOK.md for the full checklist (migrations, admin seed,
# backups, secret rotation).

services:
  - type: web
    name: invoicing-platform
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: invoicing-db
          property: connectionString
      - key: NEXTAUTH_URL
        # TODO: replace with the service's public URL after creation.
        value: https://invoicing-platform.onrender.com
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: EMAIL_PROVIDER
        value: log
      # Uploads live on the persistent disk (see below). Without the
      # disk, logos/signatures/receipts are lost on every redeploy.
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: CHROMIUM_EXECUTABLE_PATH
        value: /usr/bin/chromium
    disk:
      name: invoicing-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: invoicing-db
    # Entry-level current plan (256 MB, ~$6/mo + $0.30/GB storage).
    # The legacy `starter` plan is retired — Render rejects new
    # databases on it (hit during the first deploy, 2026-11-24).
    plan: basic-256mb
    postgresMajorVersion: 16
